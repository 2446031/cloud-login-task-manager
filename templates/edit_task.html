<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Task - Cloud Task Manager</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <nav class="navbar">

        <div class="navbar-brand">
            Cloud Task Manager
        </div>

        <div class="navbar-user">

            <a
                href="{{ url_for('dashboard') }}"
                class="nav-link"
            >
                Dashboard
            </a>

            <a
                href="{{ url_for('logout') }}"
                class="logout-btn"
            >
                Logout
            </a>

        </div>

    </nav>


    <main class="form-container">

        <div class="form-card">

            <h1>Edit Task</h1>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="message {{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}


            <form method="POST">

                <div class="form-group">

                    <label for="title">
                        Task Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        value="{{ task['title'] }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="6"
                    >{{ task['description'] or '' }}</textarea>

                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                        class="btn primary-btn"
                    >
                        Save Changes
                    </button>

                    <a
                        href="{{ url_for('dashboard') }}"
                        class="btn cancel-btn"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>

</body>
</html>
