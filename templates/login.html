<!DOCTYPE html>
<html>

<head>

    <title>Cloud Login System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Cloud Login System</h1>

    <h2>Login</h2>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
    </p>

    <a href="{{ url_for('register') }}">
        Create Account
    </a>

</div>

</body>

</html>
