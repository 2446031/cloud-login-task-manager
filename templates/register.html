<!DOCTYPE html>
<html>

<head>

    <title>Create Account</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Create Account</h1>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already have an account?
    </p>

    <a href="{{ url_for('login') }}">
        Login
    </a>

</div>

</body>

</html>
